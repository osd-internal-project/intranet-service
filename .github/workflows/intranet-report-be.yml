name: Build, Push & Deploy - Intranet Report BE

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: pkg
        run: |
          echo "version=$(node -p 'require("./services/user/package.json").version')" >> $GITHUB_OUTPUT

      - name: Login to Huawei SWR
        run: |
          docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            swr.ap-southeast-2.myhuaweicloud.com

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t swr.ap-southeast-2.myhuaweicloud.com/osd-internal/intranet-report-be:v${{ steps.pkg.outputs.version }} \
            -f services/report/Dockerfile .

      - name: Push Docker image
        run: |
          docker push swr.ap-southeast-2.myhuaweicloud.com/osd-internal/intranet-report-be:v${{ steps.pkg.outputs.version }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Login to Huawei SWR
        run: |
          docker login -u ap-southeast-2@HPUAGIPPWFA7YCNYJIGE \
            -p ${{ secrets.HUAWEI_REGISTRY_PASSWORD }} \
            swr.ap-southeast-2.myhuaweicloud.com

      - name: Deploy
        run: |
          docker pull swr.ap-southeast-2.myhuaweicloud.com/osd-internal/intranet-report-be:v${{ needs.build-and-push.outputs.version }}
          docker stop intranet-report-be || true
          docker rm intranet-report-be || true
          docker run -d --restart=always \
            --add-host=osd-auth.osd.co.th=192.168.31.140 \
            --user root:root \
            -v /var/script/data/Intranet-v2/uploads:/app/services/report/uploads \
            --env-file /var/script/images/.env-intra-report-be \
            -p 8948:4000 \
            --name intranet-report-be \
            swr.ap-southeast-2.myhuaweicloud.com/osd-internal/intranet-report-be:v${{ needs.build-and-push.outputs.version }}
